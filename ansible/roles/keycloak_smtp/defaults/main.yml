---
keycloak_smtp_kcadm: /opt/keycloak/bin/kcadm.sh
keycloak_smtp_server_url: http://localhost:8080
# Records a hash of the last applied SMTP config (including the password,
# which Keycloak never returns), so password rotations are applied too.
keycloak_smtp_stamp_file: /etc/keycloak-setup/keycloak-smtp.sha256
# Keycloak's first start (DB schema creation + auto-build) can take a while.
keycloak_smtp_wait_retries: 60
keycloak_smtp_wait_delay: 10

keycloak_smtp_config:
  host: "{{ smtp_host }}"
  port: "{{ smtp_port | string }}"
  from: "{{ smtp_from }}"
  fromDisplayName: "{{ smtp_from_display_name }}"
  auth: "true"
  starttls: "true"
  ssl: "false"
  user: "{{ smtp_username }}"
  password: "{{ smtp_password }}"
keycloak_smtp_hash: "{{ keycloak_smtp_config | to_json(sort_keys=true) | hash('sha256') }}"
