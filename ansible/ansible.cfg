# Only picked up when ansible-playbook is run from inside ansible/ (local dev).
# ansible-pull runs from the checkout root, which is why roles live in
# ansible/roles (found relative to site.yml) and vars in ansible/group_vars.
[defaults]
roles_path = ./roles
inventory = localhost,
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = false
host_key_checking = false

[connection]
pipelining = true
